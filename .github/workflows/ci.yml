name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Aganox.Identity.sln

      - name: Build
        run: dotnet build Aganox.Identity.sln -c Release --no-restore

      - name: Test
        run: dotnet test Aganox.Identity.sln -c Release --no-build
